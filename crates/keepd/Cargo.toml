[package]
name = "keepd"
description = "Session daemon: owns the PTYs and outlives every client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
keep-proto = { version = "0.0.1", path = "../keep-proto" }
keep-vt = { path = "../keep-vt" }
portable-pty = "0.9.0"

# Only macOS needs it: asking a pid for its working directory is proc_pidinfo
# here and a readlink in /proc everywhere else. Already in the lock file by
# way of portable-pty, so this adds a name and no download.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9.0"
