[package]
name = "keepd"
description = "Session daemon: owns the PTYs and outlives every client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
keep-proto = { version = "0.0.1", path = "../keep-proto" }
keep-vt = { path = "../keep-vt" }
portable-pty = "0.9.0"

# Only macOS needs it: asking a pid for its working directory is proc_pidinfo
# here and a readlink in /proc everywhere else. Already in the lock file by
# way of portable-pty, so this adds a name and no download.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9.0"

# Windows has no foreground process group and no call for a process's working
# directory: the process tree and the PEB answer instead (see `winproc`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }
