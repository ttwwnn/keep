<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a46"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e9ef"/>
      <stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5fd38d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fd38d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" stroke="#525a6a" stroke-width="10"/>
  <!-- antenna -->
  <rect x="500" y="214" width="24" height="86" rx="12" fill="#8a93a6"/>
  <circle cx="512" cy="200" r="78" fill="url(#glow)"/>
  <circle cx="512" cy="200" r="36" fill="#5fd38d"/>
  <!-- ears -->
  <rect x="214" y="440" width="64" height="170" rx="28" fill="#8a93a6"/>
  <rect x="746" y="440" width="64" height="170" rx="28" fill="#8a93a6"/>
  <!-- head, with a terminal for a face -->
  <rect x="262" y="290" width="500" height="460" rx="112" fill="url(#metal)"/>
  <rect x="318" y="350" width="388" height="300" rx="74" fill="#1b1f27"/>
  <!-- eyes -->
  <circle cx="434" cy="462" r="44" fill="#5fd38d"/>
  <circle cx="590" cy="462" r="44" fill="#5fd38d"/>
  <!-- the prompt it speaks -->
  <path d="M430 548 L470 576 L430 604" fill="none" stroke="#eceff4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="496" y="584" width="98" height="22" rx="9" fill="#eceff4"/>
  <!-- body -->
  <rect x="470" y="740" width="84" height="34" fill="#8a93a6"/>
  <rect x="392" y="764" width="240" height="96" rx="42" fill="#8a93a6"/>
  <rect x="470" y="796" width="84" height="20" rx="10" fill="#5fd38d"/>
</svg>
